services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sveltekit_blog
      POSTGRES_PASSWORD: sveltekit_blog
      POSTGRES_DB: sveltekit_blog
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sveltekit_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
