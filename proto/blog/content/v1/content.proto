syntax = "proto3";

package blog.content.v1;

option go_package = "github.com/nagutabby/sveltekit-blog/backend/gen/blog/content/v1;contentv1";

// Article carries the raw (unrendered) Markdown body plus frontmatter.
// Markdown-to-HTML rendering (marked + KaTeX + GFM heading IDs) stays in
// web, since it is tightly coupled to that JS rendering pipeline.
message Article {
  string id = 1;
  string title = 2;
  string image = 3;
  string body = 4;
  string published_at = 5; // RFC3339
  string updated_at = 6;   // RFC3339
}

message Review {
  string id = 1;
  string title = 2;
  string description = 3;
  string jp_e_code = 4;
  string image = 5;
  int32 rating = 6;
  string body = 7;
  string published_at = 8; // RFC3339
  string updated_at = 9;   // RFC3339
}

message ListArticlesRequest {}

message ListArticlesResponse {
  repeated Article articles = 1;
}

message GetArticleRequest {
  string id = 1;
}

message GetArticleResponse {
  Article article = 1;
}

message ListReviewsRequest {}

message ListReviewsResponse {
  repeated Review reviews = 1;
}

message GetReviewRequest {
  string id = 1;
}

message GetReviewResponse {
  Review review = 1;
}

// ContentService serves article/review Markdown source + frontmatter.
// Slides have no frontmatter/rendering model (they are plain PDF static
// assets enumerated by filename), so they are intentionally left out of
// this service and stay filesystem-based in web.
service ContentService {
  rpc ListArticles(ListArticlesRequest) returns (ListArticlesResponse) {}
  rpc GetArticle(GetArticleRequest) returns (GetArticleResponse) {}
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse) {}
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse) {}
}
